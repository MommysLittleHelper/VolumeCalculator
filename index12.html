<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Логистический калькулятор</title>
    <style>
        body { font-family: sans-serif; max-width: 550px; margin: 40px auto; padding: 20px; background: #f0f4f9; }
        textarea { width: 100%; height: 120px; margin-bottom: 10px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #24318a; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .result { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .details-title { margin-top: 15px; font-size: 13px; font-weight: bold; color: #555; border-top: 1px solid #eee; padding-top: 10px; }
        .detail-line { font-size: 13px; padding: 8px; border-bottom: 1px dashed #eee; color: #333; margin-bottom: 4px; border-radius: 4px; }
        .badge { background: #e2e8f0; padding: 2px 5px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .warning-line { background-color: #fffbeb; border-left: 4px solid #d97706; }
        .warning-text { font-size: 11px; color: #b45309; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h3>📦 Логистический калькулятор (Интеллектуальный автовыбор)</h3>
    <textarea id="inputText" placeholder="Вставьте строки сюда...&#10;Пример: 6*5*4&#10;Или: 150 x 150.4 x 150.99"></textarea>
    <button onclick="calculate()">Рассчитать объем</button>

    <div id="resultBox" class="result" style="display:none;">
        <p><strong>🚚 Общий объем:</strong> <span id="totalVolume">0</span> м³</p>
        <p><strong>🔢 Всего мест:</strong> <span id="totalPieces">0</span> шт.</p>
        
        <div class="details-title">🔍 Построчный разбор текста:</div>
        <div id="detailsList"></div>
    </div>

<script>
function calculate() {
    var rawText = document.getElementById('inputText').value.trim();
    if (!rawText) return alert("Введите текст");
    
    var lines = rawText.replace(/(\d+),(\d+)/g, '$1.$2').toLowerCase().split('\n');
    var totalVolume = 0, totalPieces = 0;
    var detailsHtml = '';
    
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        
        var quantity = 1;
        var hasQ = false;
        
        var qMatch = line.match(/(\d+)\s*(?:количество|кол-во|мест|шт|q)/) || line.match(/(?:количество|кол-во|мест|шт|q)\s*[:=-]?\s*(\d+)/);
        if (qMatch) {
            quantity = parseInt(qMatch[1]);
            line = line.replace(qMatch[0], " ");
            hasQ = true;
        }
        
        var numbers = line.match(/\d+(\.\d+)?/g);
        if (numbers && numbers.length >= 3) {
            if (numbers.length === 4 && !hasQ) {
                quantity = parseInt(numbers[3]);
            }
            
            var l = parseFloat(numbers[0]), w = parseFloat(numbers[1]), h = parseFloat(numbers[2]);
            var unit = 'см', divider = 1000000;
            var isDoubtful = false;
            var doubtMessage = '';
            
            var reMM = /(?:^|[^а-яa-z])(мм|mm)(?:[^а-яa-z]|$)/;
            var reCM = /(?:^|[^а-яa-z])(см|cm)(?:[^а-яa-z]|$)/;
            var reM = /(?:^|[^а-яa-z])(м|m)(?:[^а-яa-z]|$)/;
            
            if (reMM.test(line)) {
                unit = 'мм'; divider = 1000000000;
            } else if (reCM.test(line)) {
                unit = 'см'; divider = 1000000;
            } else if (reM.test(line)) {
                unit = 'м'; divider = 1;
            } else {
                // ИНТЕЛЛЕКТУАЛЬНЫЙ АНАЛИЗ ГРУЗОВЫХ ПАРАМЕТРОВ
                var sum = l + w + h;
                var maxSide = Math.max(l, w, h);
                var minSide = Math.min(l, w, h);
                
                if (sum <= 30) {
                    if (maxSide > 5) {
                        // Кейс: 6*5*4 -> одна из сторон больше 5м
                        unit = 'см'; divider = 1000000;
                        isDoubtful = true;
                        doubtMessage = '⚠️ Расчет в см, но проверьте — возможно это метры?';
                    } else {
                        unit = 'м'; divider = 1;
                    }
                } else if (sum >= 31 && sum <= 300) {
                    unit = 'см'; divider = 1000000;
                    isDoubtful = true;
                    doubtMessage = '⚠️ Расчет в см, но проверьте — возможно это мм?';
                } else if (sum >= 301 && sum <= 3000) {
                    // Анализируем структуру чисел внутри диапазона 301-3000
                    if (maxSide >= 1000 && minSide >= 100) {
                        // Кейс: 1500 x 500 x 1000 -> Точно миллиметры, без предупреждений
                        unit = 'мм'; divider = 1000000000;
                    } else if (minSide <= 25) {
                        // Кейс: 150 x 15 x 150 -> Минимальная сторона слишком мала для ММ (1.5 см). Это явно СМ.
                        unit = 'см'; divider = 1000000;
                    } else if (l > 100 && w > 100 && h > 100) {
                        // Кейс: 150 x 150.4 x 150.99 -> Все стороны крупные. Это СМ.
                        unit = 'см'; divider = 1000000;
                        isDoubtful = true;
                        doubtMessage = '⚠️ Расчет в см, но проверьте — возможно это мм?';
                    } else {
                        unit = 'мм'; divider = 1000000000;
                        isDoubtful = true;
                        doubtMessage = '⚠️ Расчет в мм, но проверьте — возможно это см?';
                    }
                } else {
                    unit = 'мм'; divider = 1000000000;
                }
            }
            
            var itemVolume = (l * w * h * quantity) / divider;
            totalVolume += itemVolume;
            totalPieces += quantity;
            
            var lineClass = isDoubtful ? 'detail-line warning-line' : 'detail-line';
            
            detailsHtml += '<div class="' + lineClass + '">' +
                'Строка ' + (i + 1) + ': ' + l + ' x ' + w + ' x ' + h + ' <span class="badge">' + unit + '</span>' +
                ' × ' + quantity + ' шт. = <strong>' + itemVolume.toFixed(4) + '</strong> м³';
            
            if (isDoubtful) {
                detailsHtml += '<div class="warning-text">' + doubtMessage + '</div>';
            }
                
            detailsHtml += '</div>';
        } else {
            detailsHtml += '<div class="detail-line" style="color: red;">Строка ' + (i + 1) + ': ❌ Не удалось распознать 3 габарита</div>';
        }
    }
    
    document.getElementById('totalVolume').innerText = totalVolume.toFixed(4);
    document.getElementById('totalPieces').innerText = totalPieces;
    document.getElementById('detailsList').innerHTML = detailsHtml;
    document.getElementById('resultBox').style.display = 'block';
}
</script>
</body>
</html>
