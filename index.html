<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логистический Калькулятор Объема</title>
    <style>
        :root {
            --primary: #24318a;
            --primary-hover: #3142bd;
            --bg: #f0f4f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
            --textarea-bg: #fafafa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); padding: 28px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(36, 49, 138, 0.1); }
        h1 { font-size: 22px; margin-bottom: 6px; text-align: center; color: var(--primary); }
        p.subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; text-align: center; }
        textarea { width: 100%; height: 160px; padding: 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; background-color: var(--textarea-bg); color: var(--text); outline: none; resize: vertical; }
        textarea:focus { border-color: var(--primary); }
        button.calc-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 16px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; margin-top: 16px; }
        button.calc-btn:hover { background-color: var(--primary-hover); }
        .results-box { border-top: 2px dashed var(--border); padding-top: 20px; margin-top: 20px; display: none; }
        .totals { background: rgba(36, 49, 138, 0.06); padding: 18px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .total-row:last-child { margin-bottom: 0; }
        .total-row strong { font-size: 20px; color: var(--primary); }
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .action-bar button { flex: 1; padding: 11px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: none; color: var(--text); }
        .action-bar button#copyBtn { border-color: var(--primary); color: var(--primary); }
        .action-bar button#copyBtn:hover { background: var(--primary); color: white; }
        .action-bar button.clear-btn:hover { background: #ef4444; color: white; border-color: #ef4444; }
        .details-title { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
        
        .detail-item { font-size: 14px; padding: 12px; border-bottom: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 4px; }
        .detail-main { display: flex; justify-content: space-between; align-items: center; }
        .unit-badge { font-size: 11px; padding: 2px 6px; background: #e2e8f0; color: #475569; border-radius: 4px; font-weight: 600; margin-left: 6px; }
        
        .warning-row { background-color: #fffbeb; border-left: 3px solid #d97706; border-radius: 6px; margin-bottom: 4px; }
        .warning-text { font-size: 12px; color: #b45309; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Логистический Калькулятор</h1>
    <p class="subtitle">Автоанализ габаритов сторон с умной подстраховкой</p>
    
    <textarea id="inputText" placeholder="Вставьте список позиций сюда..."></textarea>
    
    <button class="calc-btn" onclick="calculateVolume()">Рассчитать объем</button>
    
    <div id="resultsBox" class="results-box">
        <div class="action-bar">
            <button onclick="copyResults()" id="copyBtn">📋 Скопировать итог</button>
            <button class="clear-btn" onclick="clearAll()">🗑️ Очистить</button>
        </div>
        <div class="totals">
            <div class="total-row">
                <span>🚚 Общий объем:</span>
                <span id="totalVolume"><strong>0.000</strong> м³</span>
            </div>
            <div class="total-row">
                <span>🔢 Всего мест:</span>
                <span id="totalPieces" style="font-weight: 600;">0 шт.</span>
            </div>
        </div>
        <div class="details-title">Детализация расчета:</div>
        <div id="detailsList"></div>
    </div>
</div>

<script>
var lastTextResult = '';

function clearAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('resultsBox').style.display = 'none';
    lastTextResult = '';
}

function calculateVolume() {
    var rawText = document.getElementById('inputText').value.trim();
    var resultsBox = document.getElementById('resultsBox');
    var detailsList = document.getElementById('detailsList');
    
    if (!rawText) {
        alert("Пожалуйста, вставьте текст.");
        return;
    }
    
    var cleanText = rawText.replace(/(\d+),(\d+)/g, '$1.$2');
    var lines = cleanText.split('\n');
    
    var totalVolume = 0.0;
    var totalPieces = 0;
    var detailsHtml = '';
    var textReport = '📊 РЕЗУЛЬТАТЫ РАСЧЕТА ОБЪЕМА:\n\n';
    
    for (var i = 0; i < lines.length; i++) {
        var trimmedLine = lines[i].trim();
        if (!trimmedLine) continue;
        
        var numbers = trimmedLine.match(/\d+(\.\d+)?/g);
        
        if (numbers && numbers.length >= 4) {
            var exactNumbers = numbers.slice(-4);
            
            var parsedNumbers = [];
            for (var k = 0; k < exactNumbers.length; k++) {
                parsedNumbers.push(parseFloat(exactNumbers[k]));
            }
            
            // 🌎 КЛАССИЧЕСКАЯ ИНДЕКСАЦИЯ — Железобетонно работает везде
            var length = parsedNumbers[0];
            var width = parsedNumbers[1];
            var height = parsedNumbers[2];
            var quantity = parsedNumbers[3];
            
            var lowerLine = trimmedLine.toLowerCase();
            
            var lineUnit = 'см';
            var divider = 1000000;
            var isDoubtful = false;
            var doubtMessage = '';
            
            if (lowerLine.indexOf('мм') !== -1 || lowerLine.indexOf('mm') !== -1) {
                lineUnit = 'мм';
                divider = 1000000000;
            } else if (lowerLine.indexOf('см') !== -1 || lowerLine.indexOf('cm') !== -1) {
                lineUnit = 'см';
                divider = 1000000;
            } else if (lowerLine.indexOf(' м') !== -1 || lowerLine.indexOf(' m') !== -1) {
                lineUnit = 'м';
                divider = 1;
            } else {
                var maxSide = Math.max(length, width, height);
                
                if (maxSide <= 5.0) {
                    lineUnit = 'м';
                    divider = 1;
                } else if (maxSide > 5.0 && maxSide <= 12.0) {
                    lineUnit = 'см';
                    divider = 1000000;
                    isDoubtful = true;
                    doubtMessage = '⚠️ Подозрительно малый размер для СМ. Это СМ или МЕТРЫ? Если МЕТРЫ, допишите "м".';
                } else if (maxSide > 12.0 && maxSide <= 120.0) {
                    lineUnit = 'см';
                    divider = 1000000;
                } else if (maxSide > 120.0 && maxSide <= 300.0) {
                    lineUnit = 'см';
                    divider = 1000000;
                    isDoubtful = true;
                    doubtMessage = '⚠️ Крупный размер. Это СМ или МИЛЛИМЕТРЫ? Если ММ, допишите "мм".';
                } else {
                    lineUnit = 'мм';
                    divider = 1000000000;
                }
            }
            
            var itemVolume = (length * width * height * quantity) / divider;
            
            totalVolume += itemVolume;
            totalPieces += quantity;
            
            var itemClass = isDoubtful ? 'detail-item warning-row' : 'detail-item';
            
            detailsHtml += '<div class="' + itemClass + '">';
            detailsHtml += '  <div class="detail-main">';
            detailsHtml += '    <span>Строка ' + (i + 1) + ': ' + length + 'x' + width + 'x' + height + ' <span class="unit-badge">' + lineUnit + '</span> × ' + quantity + ' шт.</span>';
            detailsHtml += '    <span style="font-weight:600; color:var(--primary);">' + itemVolume.toFixed(3) + ' м³</span>';
            detailsHtml += '  </div>';
            if (isDoubtful) {
                detailsHtml += '  <div class="warning-text">' + doubtMessage + '</div>';
            }
            detailsHtml += '</div>';
            
            textReport += '• Строка ' + (i + 1) + ': ' + length + 'x' + width + 'x' + height + ' ' + lineUnit + ' × ' + quantity + ' шт. = ' + itemVolume.toFixed(3) + ' м³\n';
        }
    }
    
    document.getElementById('totalVolume').innerHTML = '<strong>' + totalVolume.toFixed(3) + '</strong> м³';
    document.getElementById('totalPieces').innerText = totalPieces + ' шт.';
    detailsList.innerHTML = detailsHtml;
    
    textReport += '\n___________________________\n🚚 ОБЩИЙ ОБЪЕМ: ' + totalVolume.toFixed(3) + ' м³\n🔢 ВСЕГО МЕСТ: ' + totalPieces + ' шт.';
    lastTextResult = textReport;
    
    resultsBox.style.display = 'block';
    document.getElementById('copyBtn').innerText = '📋 Скопировать итог';
}

function copyResults() {
    if (!lastTextResult) return;
    navigator.clipboard.writeText(lastTextResult).then(function() {
        document.getElementById('copyBtn').innerText = '✅ Готово!';
        setTimeout(function() { document.getElementById('copyBtn').innerText = '📋 Скопировать итог'; }, 2000);
    });
}
</script>
</body>
</html>
