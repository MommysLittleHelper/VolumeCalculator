<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логистический калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>

<div class="container">
    <div class="theme-switch">
        <button id="theme-light">☀️ Светлая</button>
        <button id="theme-dark">🌙 Тёмная</button>
        <button id="theme-system">💻 Системная</button>
    </div>

    <h1>📦 Логистический калькулятор</h1>
    <p class="subtitle">Умный автовыбор и интерактивное управление</p>
    
    <textarea id="inputText" placeholder="Вставьте строки сюда...&#10;Пример: 6*5*4&#10;Или: 1500 x 500 x 1000"></textarea>
    <button class="calc-btn" id="calcBtn">Рассчитать объем</button>

    <div id="resultBox" class="result" style="display:none;">
        <div class="totals-box">
            <p><span>🚚 Общий объем:</span> <span id="totalVolume"><strong>0.0000</strong> м³</span></p>
            <p><span>🔢 Всего мест:</span> <span id="totalPieces" style="font-weight:600;">0 шт.</span></p>
        </div>
        
        <button class="copy-btn" id="copyBtn">📋 Скопировать отчет</button>
        <!-- Добавили кнопку очистки -->
        <button class="copy-btn" id="clearBtn" style="border-color: #ef4444; color: #ef4444; margin-top: -5px;">🗑️ Очистить всё</button>
        
        <div id="bulkActions" class="bulk-box" style="display:none;">
            <span>Применить ко всем строкам:</span>
            <div class="badge-group">
                <button class="btn-badge bulk-unit-btn" data-unit="м">м</button>
                <button class="btn-badge bulk-unit-btn" data-unit="см">см</button>
                <button class="btn-badge bulk-unit-btn" data-unit="мм">мм</button>
            </div>
        </div>

        <div class="details-title">🔍 Построчный разбор текста:</div>
        <div id="detailsList"></div>
    </div>
</div>
<!-- Кнопка скачивания архива расширения для коллег -->
<div style="margin-top: 25px; text-align: center;">
    <a href="cargo-extension-v1.1.zip" download style="display: inline-block; padding: 10px 16px; background: rgba(59, 130, 246, 0.1); color: var(--primary); border: 1px solid var(--primary); border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s;">💾 Скачать расширение для Chrome (.ZIP)</a>
</div>

</body>
</html>
